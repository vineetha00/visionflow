[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name only. The import package and CLI are still `visionflow` /
# `vf` -- [project.name] and [project.scripts] are independent. The bare name
# `visionflow` is a registered but empty project on PyPI owned by someone else,
# so uploads to it are rejected with 403. Note that pypi.org/pypi/<name>/json
# returns 404 for such names, which makes it useless as an availability check;
# pypi.org/simple/<name>/ is the endpoint that tells the truth.
name = "visionflow-edge"
version = "0.2.0"
description = "Edge-first, quantized Vision-Language Model pipeline for local medical and document intelligence"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Vineetha", email = "vineetha@usc.edu" }]
keywords = ["vlm", "vision-language-model", "quantization", "edge-ai", "medical-ai", "document-intelligence", "smolvlm", "local-inference"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "torch>=2.2",
  "transformers>=4.42",
  "accelerate>=0.30",
  "pillow>=10.0",
  "numpy>=1.24",
  "psutil>=5.9",
]

[project.optional-dependencies]
cuda = ["bitsandbytes>=0.43"]
cpu = ["llama-cpp-python>=0.2.90"]
eval = ["openai>=1.30", "matplotlib>=3.8", "psutil>=5.9"]
# onnxscript is required by torch>=2.6's exporter, which reaches for it even on
# the legacy torchscript path. Without it torch.onnx.export raises
# ModuleNotFoundError and every provider row degrades to "graph not found".
onnx = ["onnx>=1.16", "onnxruntime>=1.18", "onnxscript>=0.1"]
onnx-gpu = ["onnx>=1.16", "onnxruntime-gpu>=1.18", "onnxscript>=0.1"]
constrained = ["outlines>=0.1"]
dev = ["pytest>=8.0", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/vineetha00/visionflow"
Repository = "https://github.com/vineetha00/visionflow"

[project.scripts]
visionflow = "visionflow.cli:main"
vf = "visionflow.cli:main"

[tool.setuptools.packages.find]
include = ["visionflow*"]
